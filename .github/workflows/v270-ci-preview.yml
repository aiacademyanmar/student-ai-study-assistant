name: Student AI - Isolated Native 20 Screen APK CI
on:
  push:
    branches: [student-ai-v270-ci-preview]
    paths:
      - '.github/workflows/v270-ci-preview.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate 20-page UI illustrations
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/generate_ui_png.py
      - name: Build native Java debug APK from repository main-derived source
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and launcher
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          grep -q "package: name='asia.aaii.studentstudy'" apk-badging.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StudentAI-Java20Screens-CI-Preview-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
