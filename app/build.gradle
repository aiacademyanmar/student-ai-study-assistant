plugins {
    id 'com.android.application'
}

android {
    namespace 'asia.aaii.studentstudy'
    compileSdk 35

    defaultConfig {
        applicationId 'asia.aaii.studentstudy'
        minSdk 23
        targetSdk 35
        versionCode 44
        versionName '2.41.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField 'String', 'STUDENT_AI_API_URL', '"https://aaii.asia/studentai/api.php"'
    }
}
