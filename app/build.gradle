plugins {
    id 'com.android.application'
}

android {
    namespace 'asia.aaii.studentstudy'
    compileSdk 35

    defaultConfig {
        applicationId 'asia.aaii.studentstudy'
        minSdk 23
        targetSdk 35
        versionCode 28
        versionName '2.26.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}
